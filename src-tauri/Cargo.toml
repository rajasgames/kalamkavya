[package]
name = "inkwell"
version = "0.0.0"
description = "Inkwell: The World-Building Engine"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-save", "fs-write-file", "window-close", "window-minimize", "window-maximize", "window-unmaximize", "window-start-dragging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
