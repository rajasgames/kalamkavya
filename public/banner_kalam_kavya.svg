<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background & Ambient Gradients -->
    <radialGradient id="bgGlowLeft" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14a098" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowRight" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d96b43" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0e17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#e5a93c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d96b43"/>
      <stop offset="50%" stop-color="#f5c71a"/>
      <stop offset="100%" stop-color="#14a098"/>
    </linearGradient>

    <!-- App Icon Gradients -->
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7a0d"/>
      <stop offset="50%" stop-color="#14a098"/>
      <stop offset="100%" stop-color="#022c7a"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c71a"/>
      <stop offset="50%" stop-color="#1a5ff5"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14a098" flood-opacity="0.3"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1280" height="720" fill="#0f0e17"/>
  <rect width="1280" height="720" fill="url(#bgGlowLeft)"/>
  <rect width="1280" height="720" fill="url(#bgGlowRight)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="bannerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#bannerGrid)"/>
  </g>

  <!-- Left Side: App Icon Container -->
  <g transform="translate(110, 104)" filter="url(#iconShadow)">
    <!-- Icon Backdrop Glow Ring -->
    <rect x="-12" y="-12" width="536" height="536" rx="44" fill="#ffffff" opacity="0.03" stroke="url(#accentGrad)" stroke-width="2"/>
    
    <!-- SVG App Icon scaled to 512x512 -->
    <g transform="scale(1.0)">
      <!-- Paper Background -->
      <rect x="80" y="60" width="352" height="400" rx="16" fill="#fdfaf3" stroke="#e0d5c1" stroke-width="8"/>
      <line x1="120" y1="140" x2="392" y2="140" stroke="#e0d5c1" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="120" y1="200" x2="392" y2="200" stroke="#e0d5c1" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="120" y1="260" x2="392" y2="260" stroke="#e0d5c1" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="120" y1="320" x2="392" y2="320" stroke="#e0d5c1" stroke-width="4" stroke-dasharray="8 8"/>

      <!-- Peacock Feather Quill -->
      <g transform="translate(40, -40) rotate(15, 256, 256)">
        <path d="M 200 420 Q 256 300 350 150" fill="none" stroke="#e6e6e6" stroke-width="6" stroke-linecap="round"/>
        <path d="M 350 150 Q 280 120 220 200 Q 180 280 200 420 Q 260 380 320 300 Q 380 220 350 150 Z" fill="url(#featherGrad)" opacity="0.9"/>
        <path d="M 350 150 Q 420 180 360 280 Q 300 350 200 420 Q 230 330 300 240 Q 360 180 350 150 Z" fill="url(#featherGrad)" opacity="0.7"/>
        <ellipse cx="310" cy="210" rx="35" ry="55" transform="rotate(45, 310, 210)" fill="url(#eyeGrad)"/>
        <ellipse cx="310" cy="210" rx="15" ry="25" transform="rotate(45, 310, 210)" fill="#061244"/>
        <path d="M 197 420 L 180 470 L 203 420 Z" fill="#b0a28f"/>
        <path d="M 180 470 L 190 460 L 192 480 Z" fill="#333"/>
      </g>
    </g>
  </g>

  <!-- Right Side: Brand Content & Typography -->
  <g transform="translate(620, 220)" filter="url(#textShadow)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#d96b43" fill-opacity="0.15" stroke="#d96b43" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e5a93c" letter-spacing="2.5">ALL-IN-ONE NARRATIVE STUDIO</text>

    <!-- Main Title: कalam काvya -->
    <text x="0" y="125" font-family="'Georgia', 'Cinzel', 'Noto Sans Devanagari', serif" font-size="78" font-weight="800" fill="url(#titleGrad)" letter-spacing="1">
      कalam काvya
    </text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="155" width="520" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle / Pitch -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#c4c4d4" letter-spacing="0.3">
      The Narrative Studio &amp; Worldbuilding Engine
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="300" fill="#9090a8" letter-spacing="0.2">
      Craft Sagas • Map Cast Dynamics • Local AI Sovereignty
    </text>

    <!-- Feature Badges/Pills -->
    <g transform="translate(0, 280)">
      <!-- Badge 1: Offline First -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <text x="67.5" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">⚡ Offline First</text>
      </g>
      <!-- Badge 2: Local AI -->
      <g transform="translate(147, 0)">
        <rect width="145" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <text x="72.5" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#14a098" text-anchor="middle">✨ Privacy AI Co-Pilot</text>
      </g>
      <!-- Badge 3: World Bible -->
      <g transform="translate(304, 0)">
        <rect width="145" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <text x="72.5" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#d96b43" text-anchor="middle">📖 World Bible</text>
      </g>
    </g>
  </g>
</svg>
